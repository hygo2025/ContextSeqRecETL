[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextseqrec-etl"
version = "0.1.0"
description = "Standalone real-estate ETL for ContextSeqRec"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "h3==4.5.0",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pyarrow==25.0.0",
  "pyspark==3.5.9",
  "setuptools==84.0.0",
  "tqdm==4.69.1",
]

[project.scripts]
contextseqrec-etl = "contextseqrec_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
